[project]
name = "shellmate"
version = "0.4.0"
description = "A smart terminal: plain-language requests, local LLM, every command confirmed (Arch, Debian, Ubuntu, Fedora)"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/radeonchik/shellmate"

[project.scripts]
shellmate = "shellmate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shellmate"]
