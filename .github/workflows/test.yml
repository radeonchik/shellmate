name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # the package-manager backends against the real thing: read-only `shellmate --selftest`
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "debian:12", "ubuntu:22.04", "ubuntu:24.04", "fedora:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Base tools
        run: |
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm python git; fi
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 git ca-certificates
          fi
          if command -v dnf >/dev/null; then dnf install -y python3 git; fi
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Self-test of the distro backend
        run: python3 -m shellmate --selftest
